<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Animated sunrise spark icon</title>
  <desc id="desc">A rising sun with a discovery spark.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { display: none; }
      .rays { opacity: 1; }
    }
  </style>
  <g stroke="#D97706" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="500ms" fill="freeze" />
      <path d="M49 169h119" />
      <path d="M78 169a30 30 0 0 1 60 0" />
    </g>
    <g class="rays" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="180ms" dur="320ms" fill="freeze" />
      <path d="M108 90v24" />
      <path d="m71 105 16 20" />
      <path d="m145 105-16 20" />
      <path d="m48 138 24 8" />
      <path d="m168 138-24 8" />
    </g>
    <g transform="translate(191 92)">
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.72;1.1;1" begin="260ms" dur="450ms" fill="freeze" />
      <path d="M0-28c3 17 11 25 28 28-17 3-25 11-28 28-3-17-11-25-28-28 17-3 25-11 28-28Z" />
    </g>
  </g>
</svg>
