<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 256" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Lume</title>
  <desc id="desc">Animated Lume wordmark with a rising sun and discovery spark.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { display: none; }
      .rays { opacity: 1; }
    }
    .wordmark { fill: #1C1B18; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #FAF9F6; }
    }
  </style>
  <g stroke="#D97706" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="500ms" fill="freeze" />
      <path d="M41 169h119" />
      <path d="M70 169a30 30 0 0 1 60 0" />
    </g>
    <g class="rays" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="180ms" dur="320ms" fill="freeze" />
      <path d="M100 90v24" />
      <path d="m63 105 16 20" />
      <path d="m137 105-16 20" />
      <path d="m40 138 24 8" />
      <path d="m160 138-24 8" />
    </g>
    <g transform="translate(183 92)">
      <animateTransform attributeName="transform" type="translate" values="183 92;183 92;183 92" dur="1s" fill="freeze" />
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.72;1.1;1" begin="260ms" dur="450ms" fill="freeze" />
      <path d="M0-28c3 17 11 25 28 28-17 3-25 11-28 28-3-17-11-25-28-28 17-3 25-11 28-28Z" />
    </g>
  </g>
  <text class="wordmark" x="232" y="169" font-family="Geist, Inter, Arial, sans-serif" font-size="116" font-weight="400" letter-spacing="-6">Lume</text>
</svg>
